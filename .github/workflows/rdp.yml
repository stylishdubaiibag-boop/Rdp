name: RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Set Password and Enable RDP
        run: |
          # runneradmin ka password set karein
          net user runneradmin "Password123!"
          
          # Remote Desktop enable karein aur Network Level Authentication off karein
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # Firewall mein RDP allow karein
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install and Connect to Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Tailscale official silent installer download aur run karein
          Write-Host "Downloading Tailscale..."
          $installerUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-amd64.msi"
          Invoke-WebRequest -Uri $installerUrl -OutFile "tailscale-setup.msi"
          
          Write-Host "Installing Tailscale..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i tailscale-setup.msi /quiet /norestart" -Wait
          
          # Tailscale start karein aur AuthKey se login karein
          $tailscalePath = "${{ env.ProgramFiles }}\Tailscale\tailscale.exe"
          & $tailscalePath up --authkey="${env:TAILSCALE_AUTHKEY}" --accept-routes
          
          Write-Host "Tailscale connected successfully!"

      - name: Keep RDP Alive
        run: |
          Write-Host "RDP is ready! Connect using your Tailscale IP."
          Start-Sleep -Seconds 21600
