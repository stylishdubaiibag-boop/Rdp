name: RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Set Password and Enable RDP
        run: |
          net user runneradmin "Password123!"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install and Connect to Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Tailscale latest MSI download link fetch karke install karein
          Write-Host "Fetching Tailscale installer..."
          $webpage = Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/" -UseBasicParsing
          $msiLink = "https://pkgs.tailscale.com/stable/" + ($webpage.links | Where-Object href -like "*amd64.msi" | Select-Object -ExpandProperty href | Select-Object -First 1)
          
          Write-Host "Downloading from: $msiLink"
          Invoke-WebRequest -Uri $msiLink -OutFile "tailscale.msi"
          
          Write-Host "Installing Tailscale..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i tailscale.msi /quiet /norestart" -Wait
          
          # Tailscale start karein aur AuthKey se login karein
          $tailscalePath = "${{ env.ProgramFiles }}\Tailscale\tailscale.exe"
          & $tailscalePath up --authkey="${env:TAILSCALE_AUTHKEY}" --accept-routes
          
          Write-Host "Tailscale connected successfully!"

      - name: Keep RDP Alive
        run: |
          Write-Host "RDP is ready! Connect using your Tailscale IP."
          Start-Sleep -Seconds 21600
